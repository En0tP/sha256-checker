<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка SHA-256</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
            max-width: 500px;
            margin: 40px auto;
        }
        .card {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        h2 { margin-top: 0; font-size: 20px; color: #1a73e8; }
        p { font-size: 14px; color: #666; }
        .file-input-wrapper {
            margin: 20px 0;
        }
        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 2px dashed #ccc;
            border-radius: 6px;
            background: #fafafa;
            cursor: pointer;
            box-sizing: border-box;
        }
        #status {
            font-size: 14px;
            font-weight: bold;
            margin: 10px 0;
            color: #1a73e8;
        }
        .progress-bar-container {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 4px;
            margin: 10px 0;
            overflow: hidden;
            display: none;
        }
        .progress-bar {
            width: 0%;
            height: 18px;
            background-color: #1a73e8;
            text-align: center;
            color: white;
            font-size: 12px;
            line-height: 18px;
        }
        .result-box {
            background: #f1f3f4;
            padding: 12px;
            border-radius: 6px;
            word-break: break-all;
            font-family: monospace;
            font-size: 14px;
            margin-top: 10px;
            user-select: all;
        }
        button {
            background: #1a73e8;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 15px;
            width: 100%;
            display: none;
        }
        button:hover { background: #1557b0; }
    </style>
</head>
<body>

<div class="card">
    <h2>Проверка SHA-256</h2>
    <p>Выберите ZIP-файл.</p>
    
    <div class="file-input-wrapper">
        <input type="file" id="fileInput">
    </div>
    
    <div id="status"></div>
    <div class="progress-bar-container" id="progressContainer">
        <div class="progress-bar" id="progressBar">0%</div>
    </div>

    <div id="resultContainer" style="display:none;">
        <p><strong>SHA-256 Хеш:</strong></p>
        <div class="result-box" id="resultHash"></div>
        <button id="copyBtn" onclick="copyToClipboard()">Скопировать хеш</button>
    </div>
</div>

<script>
// Максимально оптимизированный SHA-256 движок
(function(root, factory) {
    root.SHA256 = factory();
}(this, function() {
    var K = new Uint32Array([
        0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
        0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
        0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
        0x983e5152, 0xa831c66d, 0xb03239c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
        0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
        0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
        0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
        0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
    ]);

    function Hash() {
        this.h = new Uint32Array([
            0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a,
            0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19
        ]);
        this.block = new Uint8Array(64);
        this.blockLength = 0;
        this.totalLength = 0;
        this.W = new Uint32Array(64);
    }

    Hash.prototype.update = function(bytes) {
        var len = bytes.length;
        var offset = 0;

        while (len > 0) {
            var space = 64 - this.blockLength;
            var take = len < space ? len : space;
            this.block.set(bytes.subarray(offset, offset + take), this.blockLength);
            this.blockLength += take;
            this.totalLength += take;
            offset += take;
            len -= take;

            if (this.blockLength === 64) {
                this._processBlock(this.block);
                this.blockLength = 0;
            }
        }
    };

    Hash.prototype._processBlock = function(block) {
        var W = this.W;
        for (var i = 0; i < 16; i++) {
            W[i] = (block[i * 4] << 24) | (block[i * 4 + 1] << 16) | (block[i * 4 + 2] << 8) | block[i * 4 + 3];
        }
        for (var i = 16; i < 64; i++) {
            var w15 = W[i - 15];
            var s0 = (w15 >>> 7 | w15 << 25) ^ (w15 >>> 18 | w15 << 14) ^ (w15 >>> 3);
            var w2 = W[i - 2];
            var s1 = (w2 >>> 17 | w2 << 15) ^ (w2 >>> 19 | w2 << 13) ^ (w2 >>> 10);
            W[i] = (W[i - 16] + s0 + W[i - 7] + s1) | 0;
        }

        var a = this.h[0], b = this.h[1], c = this.h[2], d = this.h[3];
        var e = this.h[4], f = this.h[5], g = this.h[6], h = this.h[7];

        for (var i = 0; i < 64; i++) {
            var S1 = (e >>> 6 | e << 26) ^ (e >>> 11 | e << 21) ^ (e >>> 25 | e << 7);
            var ch = (e & f) ^ (~e & g);
            var temp1 = (h + S1 + ch + K[i] + W[i]) | 0;
            var S0 = (a >>> 2 | a << 30) ^ (a >>> 13 | a << 19) ^ (a >>> 22 | a << 10);
            var maj = (a & b) ^ (a & c) ^ (b & c);
            var temp2 = (S0 + maj) | 0;

            h = g;
            g = f;
            f = e;
            e = (d + temp1) | 0;
            d = c;
            c = b;
            b = a;
            a = (temp1 + temp2) | 0;
        }

        this.h[0] = (this.h[0] + a) | 0;
        this.h[1] = (this.h[1] + b) | 0;
        this.h[2] = (this.h[2] + c) | 0;
        this.h[3] = (this.h[3] + d) | 0;
        this.h[4] = (this.h[4] + e) | 0;
        this.h[5] = (this.h[5] + f) | 0;
        this.h[6] = (this.h[6] + g) | 0;
        this.h[7] = (this.h[7] + h) | 0;
    };

    Hash.prototype.hex = function() {
        var padLen = (this.blockLength < 56) ? (56 - this.blockLength) : (120 - this.blockLength);
        var bitLen = this.totalLength * 8;
        
        var padding = new Uint8Array(padLen + 8);
        padding[0] = 0x80;
        for (var i = 0; i < 8; i++) {
            padding[padding.length - 1 - i] = (bitLen >>> (i * 8)) & 0xff;
        }
        
        var clone = new Hash();
        clone.h.set(this.h);
        clone.block.set(this.block);
        clone.blockLength = this.blockLength;
        clone.totalLength = this.totalLength;
        clone.update(padding);

        var hex = '';
        for (var i = 0; i < 8; i++) {
            var str = (clone.h[i] >>> 0).toString(16);
            hex += '00000000'.substr(str.length) + str;
        }
        return hex;
    };

    return {
        create: function() {
            return new Hash();
        }
    };
}));

document.getElementById('fileInput').addEventListener('change', function(e) {
    var file = e.target.files[0];
    var status = document.getElementById('status');
    var progressContainer = document.getElementById('progressContainer');
    var progressBar = document.getElementById('progressBar');
    var resultContainer = document.getElementById('resultContainer');
    var resultHash = document.getElementById('resultHash');
    var copyBtn = document.getElementById('copyBtn');

    if (!file) return;

    status.style.color = '#1a73e8';
    status.textContent = 'Чтение файла (' + (file.size / (1024 * 1024 * 1024)).toFixed(2) + ' ГБ)...';
    progressContainer.style.display = 'block';
    progressBar.style.width = '0%';
    progressBar.textContent = '0%';
    resultContainer.style.display = 'none';
    copyBtn.style.display = 'none';

    // Увеличиваем размер блока до 100 МБ для максимального ускорения чтения тяжелых прошивок
    var CHUNK_SIZE = 150 * 1024 * 1024; // 150 МБ
    var offset = 0;
    var hasher = SHA256.create();
    var lastPercent = -1;

    function readNext() {
        if (offset >= file.size) {
            var hashHex = hasher.hex();
            status.style.color = '#0f9d58';
            status.textContent = 'Готово! Прошивка проверена.';
            progressContainer.style.display = 'none';
            resultHash.textContent = hashHex;
            resultContainer.style.display = 'block';
            copyBtn.style.display = 'block';
            return;
        }

        var slice = file.slice(offset, offset + CHUNK_SIZE);
        var reader = new FileReader();

        reader.onload = function(evt) {
            hasher.update(new Uint8Array(evt.target.result));
            offset += CHUNK_SIZE;
            
            var percent = Math.min(100, Math.round((offset / file.size) * 100));
            if (percent !== lastPercent) {
                lastPercent = percent;
                progressBar.style.width = percent + '%';
                progressBar.textContent = percent + '%';
                status.textContent = 'Обработка: ' + percent + '%';
            }

            setTimeout(readNext, 0);
        };

        reader.onerror = function() {
            status.style.color = '#d93025';
            status.textContent = 'Ошибка чтения файла прошивки.';
            progressContainer.style.display = 'none';
        };

        reader.readAsArrayBuffer(slice);
    }

    readNext();
});

// Надежная функция копирования (с поддержкой старых браузеров и мобильных устройств)
function copyToClipboard() {
    var textElement = document.getElementById('resultHash');
    var text = textElement.textContent || textElement.innerText;

    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function() {
            alert('Хеш успешно скопирован в буфер обмена!');
        }).catch(function() {
            fallbackCopy(text);
        });
    } else {
        fallbackCopy(text);
    }
}

function fallbackCopy(text) {
    var textArea = document.createElement("textarea");
    textArea.value = text;
    textArea.style.position = "fixed";  // Чтобы не прокручивало страницу вниз
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    try {
        var successful = document.execCommand('copy');
        if (successful) {
            alert('Хеш успешно скопирован в буфер обмена!');
        } else {
            alert('Не удалось скопировать. Скопируйте текст вручную.');
        }
    } catch (err) {
        alert('Ошибка копирования.');
    }
    document.body.removeChild(textArea);
}
</script>

</body>
</html>
